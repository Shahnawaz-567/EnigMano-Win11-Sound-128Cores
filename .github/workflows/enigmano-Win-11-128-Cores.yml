name: "⚡ EnigMano Win11 + 128 Cores Deployment"

on:
  workflow_dispatch:
    inputs:
      INSTANCE:
        description: "Instance number to deploy"
        required: true
        default: "1"

jobs:
  deploy-enigmano:
    name: "🚀 Deploy EnigMano Instance ${{ github.event.inputs.INSTANCE }}"
    runs-on: windows-latest

    env:
      INSTANCE_ID: ${{ github.event.inputs.INSTANCE }}
      SECRET_SHAHZAIB: ${{ secrets.SECRET_SHAHZAIB }}
      NGROK_SHAHZAIB: ${{ secrets.NGROK_SHAHZAIB }}

    steps:
      - name: 📌 Deployment Parameters
        shell: pwsh
        run: |
          Write-Host "==============================================="
          Write-Host "🔹 EnigMano Instance     : $env:INSTANCE_ID"
          Write-Host "👤 Created By            : Mr Alone"
          Write-Host "==============================================="

      - name: 🔐 Validate Secrets
        shell: pwsh
        run: |
          if (-not $env:SECRET_SHAHZAIB) { Write-Error "❌ Missing: SECRET_SHAHZAIB"; exit 1 }
          if (-not $env:NGROK_SHAHZAIB) { Write-Error "❌ Missing: NGROK_SHAHZAIB"; exit 1 }
          if (-not "${{ secrets.MRALONE_LK }}") { Write-Error "❌ Missing: MRALONE_LK"; exit 1 }
          Write-Host "✅ All secrets validated successfully."

      - name: 📥 Download and Universal Extract
        shell: pwsh
        env:
          ZIP_URL: ${{ secrets.MRALONE_LK }}
        run: |
          Write-Host "🌐 Discord se ZIP download ho rahi hai..."
          curl.exe -L -o "package_data.zip" $env:ZIP_URL
          
          Write-Host "📦 Files extract ho rahi hain..."
          Expand-Archive -Path "package_data.zip" -DestinationPath "." -Force
          
          Write-Host "🔍 Deep Scanning for EnigMano-instance.ps1..."
          # Ye command folders ke andar ghus kar file dhoondegi
          $foundScript = Get-ChildItem -Filter "EnigMano-instance.ps1" -Recurse | Select-Object -First 1
          
          if ($foundScript) {
            Write-Host "✅ Script mil gayi: $($foundScript.FullName)"
            $baseDir = Split-Path -Path $foundScript.FullName
            # Files ko folder se nikal kar bahar (Root) par move kar rahe hain
            Get-ChildItem -Path "$baseDir\*" | Copy-Item -Destination "." -Force -Recurse
            Write-Host "🚚 Saari tactical files root par move kar di gayi hain."
          } else {
            Write-Error "❌ Error: ZIP ke andar EnigMano-instance.ps1 nahi mili!"
            exit 1
          }

      - name: ⚔️ Execute Tactical Script
        shell: pwsh
        run: |
          Write-Host "🚦 Starting EnigMano-instance.ps1 with Bypass Policy..."
          powershell.exe -ExecutionPolicy Bypass -File ".\EnigMano-instance.ps1"

      - name: 💠 Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "==============================================="
          Write-Host "🏁 Mission Completed Successfully."
          Write-Host "🔋 Powered by: Mr Alone"
          Write-Host "==============================================="
