name: "⚡ EnigMano Win11 + 128 Cores Deployment"

on:
  workflow_dispatch:
    inputs:
      INSTANCE:
        description: "Instance number to deploy (e.g., 1, 2, 3...)"
        required: true
        default: "1"

jobs:
  deploy-enigmano:
    name: "🚀 Deploy EnigMano Instance ${{ github.event.inputs.INSTANCE }}"
    runs-on: windows-11-arm

    env:
      INSTANCE_ID: ${{ github.event.inputs.INSTANCE }}
      SECRET_SHAHZAIB: ${{ secrets.SECRET_SHAHZAIB }}
      NGROK_SHAHZAIB: ${{ secrets.NGROK_SHAHZAIB }}
      REPO: ${{ github.repository }}

    steps:
      - name: 📌 Deployment Parameters
        shell: pwsh
        run: |
          Write-Host "==============================================="
          Write-Host "🔹 EnigMano Instance     : $env:INSTANCE_ID"
          Write-Host "📦 GitHub Repository     : $env:REPO"
          Write-Host "🆔 Deployment ID         : ${{ github.run_id }}"
          Write-Host "👤 Created By            : Mr Alone"
          Write-Host "==============================================="

      - name: 🔐 Validate Secrets
        shell: pwsh
        run: |
          if (-not $env:SECRET_SHAHZAIB) { Write-Error "❌ Missing: SECRET_SHAHZAIB"; exit 1 }
          if (-not $env:NGROK_SHAHZAIB) { Write-Error "❌ Missing: NGROK_SHAHZAIB"; exit 1 }
          # Using Underscore (_) instead of Dash (-) as per GitHub rules
          if (-not "${{ secrets.MRALONE_LK }}") { 
            Write-Error "❌ Missing Secret: MRALONE_LK (Check spelling in GitHub Settings!)"
            exit 1 
          }
          Write-Host "✅ All tactical secrets (including MRALONE_LK) validated."

      - name: 📥 Download and Extract Full Package
        shell: pwsh
        env:
          ZIP_URL: ${{ secrets.MRALONE_LK }}
        run: |
          Write-Host "🌐 Initiating Secure Download from Discord CDN..."
          curl.exe -L -o "EnigMano_Files.zip" $env:ZIP_URL
          
          Write-Host "📦 Extracting all tactical files from ZIP..."
          
          Expand-Archive -Path "EnigMano_Files.zip" -DestinationPath "." -Force
          
          if (!(Test-Path "./EnigMano-Instance.ps1")) {
            Write-Error "❌ Error: EnigMano-Instance.ps1 not found in ZIP! Check your file names inside the zip."
            exit 1
          }
          Write-Host "✅ Files deployed successfully in current directory."

      - name: ⚔️ Execute EnigMano Instance Script
        shell: pwsh
        run: |
          Write-Host "🚦 Starting EnigMano-Instance.ps1 Execution..."
          powershell.exe -ExecutionPolicy Bypass -File ".\EnigMano-Instance.ps1"

      - name: 💠 Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "==============================================="
          Write-Host "🏁 Deployment process finished."
          Write-Host "🔋 Powered by: Mr Alone"
          Write-Host "==============================================="
