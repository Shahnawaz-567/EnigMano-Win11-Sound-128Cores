name: "鈿� EnigMano Win11 + 128 Cores Deployment"

on:
  workflow_dispatch:
    inputs:
      INSTANCE:
        description: "Instance number to deploy (e.g., 1, 2, 3...)"
        required: true
        default: "1"

jobs:
  deploy-enigmano:
    name: "馃殌 Deploy EnigMano Instance ${{ github.event.inputs.INSTANCE }}"
    runs-on: windows-11-arm

    env:
      INSTANCE_ID: ${{ github.event.inputs.INSTANCE }}
      SECRET_SHAHZAIB: ${{ secrets.SECRET_SHAHZAIB }}
      NGROK_SHAHZAIB: ${{ secrets.NGROK_SHAHZAIB }}
      REPO: ${{ github.repository }}
      WORKFLOW_FILE: "enigmano-Win-11-128-Cores.yml"
      DEPLOYMENT_ID: ${{ github.run_id }}

    steps:
      - name: 馃搶 Deployment Parameters
        shell: pwsh
        run: |
          $prevInstance = [int]$env:INSTANCE_ID - 1
          Write-Host "==============================================="
          Write-Host "馃敼 EnigMano Instance     : $env:INSTANCE_ID"
          Write-Host "馃敘 Previous Instance     : $prevInstance"
          Write-Host "馃摝 GitHub Repository     : $env:REPO"
          Write-Host "馃攣 Deployment Workflow   : $env:WORKFLOW_FILE"
          Write-Host "馃啍 Deployment ID         : $env:DEPLOYMENT_ID"
          Write-Host "==============================================="

      - name: 馃攼 Validate Secrets
        shell: pwsh
        run: |
          if (-not $env:SECRET_SHAHZAIB) {
            Write-Error "鉂� Missing GitHub Secret: SECRET_SHAHZAIB"
            exit 1
          }
          if (-not $env:NGROK_SHAHZAIB) {
            Write-Error "鉂� Missing Ngrok Auth Token: NGROK_SHAHZAIB"
            exit 1
          }
          Write-Host "鉁� All required secrets validated successfully"

      - name: 馃摜 Download EnigMano-instance.ps1
        shell: pwsh
        run: |
          $url = "https://gitlab.com/Shahzaib-YT/enigmano-windows-11-with-sound/-/raw/main/EnigMano-Instance.ps1"
          Write-Host "馃寪 Downloading EnigMano-Instance.ps1..."
          Invoke-WebRequest -Uri $url -OutFile "EnigMano-Instance.ps1" -UseBasicParsing
          if (!(Test-Path "./EnigMano-Instance.ps1")) {
            Write-Error "鉂� Failed to download EnigMano-Instance.ps1"
            exit 1
          }
          Write-Host "鉁� EnigMano-Instance.ps1 downloaded successfully"

      - name: 鈿旓笍 Execute EnigMano Instance Script
        shell: pwsh
        run: |
          Write-Host "馃殾 Initiating EnigMano-Instance.ps1"
          powershell.exe -ExecutionPolicy Bypass -File ".\EnigMano-Instance.ps1"

      - name: 馃挔 Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "鉁� EnigMano Instance $env:INSTANCE_ID completed execution."
          Write-Host "馃攱 Powered by: SHAHZAIB-YT"
          Write-Host "馃弫 EnigMano deployment executed with tactical precision."
