name: "⚡ EnigMano Win11 + 128 Cores Deployment"

on:
  workflow_dispatch:
    inputs:
      INSTANCE:
        description: "Instance number to deploy"
        required: true
        default: "1"

jobs:
  deploy-enigmano:
    name: "🚀 Deploy EnigMano Instance ${{ github.event.inputs.INSTANCE }}"
    runs-on: windows-latest

    env:
      INSTANCE_ID: ${{ github.event.inputs.INSTANCE }}
      SECRET_SHAHZAIB: ${{ secrets.SECRET_SHAHZAIB }}
      NGROK_SHAHZAIB: ${{ secrets.NGROK_SHAHZAIB }}

    steps:
      - name: 📌 Deployment Parameters
        shell: pwsh
        run: |
          Write-Host "==============================================="
          Write-Host "🔹 EnigMano Instance     : $env:INSTANCE_ID"
          Write-Host "👤 Created By            : Mr Alone"
          Write-Host "==============================================="

      - name: 🔐 Validate Secrets
        shell: pwsh
        run: |
          if (-not $env:SECRET_SHAHZAIB) { Write-Error "❌ Missing: SECRET_SHAHZAIB"; exit 1 }
          if (-not $env:NGROK_SHAHZAIB) { Write-Error "❌ Missing: NGROK_SHAHZAIB"; exit 1 }
          if (-not "${{ secrets.MRALONE_LK }}") { Write-Error "❌ Missing: MRALONE_LK"; exit 1 }
          Write-Host "✅ Secrets validated."

      - name: 📥 Download and Force Extract
        shell: pwsh
        env:
          ZIP_URL: ${{ secrets.MRALONE_LK }}
        run: |
          Write-Host "🌐 Discord se package uthaya ja raha hai..."
          curl.exe -L -o "package.zip" $env:ZIP_URL
          
          Write-Host "📦 Files ko Force Extract kiya ja raha hai..."
          # Hum ab tar.exe use kar rahe hain jo Expand-Archive se behtar hai
          mkdir temp_extract
          tar.exe -xf package.zip -C temp_extract
          
          Write-Host "🔍 Script dhoondi ja rahi hai..."
          $script = Get-ChildItem -Path "temp_extract" -Filter "EnigMano-instance.ps1" -Recurse | Select-Object -First 1
          
          if ($script) {
            Write-Host "✅ Script mil gayi: $($script.FullName)"
            $dir = Split-Path $script.FullName
            Copy-Item -Path "$dir\*" -Destination "." -Recurse -Force
            Write-Host "🚚 Saari files root par move kar di gayi hain."
          } else {
            Write-Error "❌ Error: ZIP mein EnigMano-instance.ps1 nahi mili!"
            exit 1
          }

      - name: ⚔️ Execute Tactical Script
        shell: pwsh
        run: |
          Write-Host "🚦 EnigMano-instance.ps1 start ho rahi hai..."
          powershell.exe -ExecutionPolicy Bypass -File ".\EnigMano-instance.ps1"

      - name: 💠 Final Status
        if: always()
        shell: pwsh
        run: |
          Write-Host "==============================================="
          Write-Host "🏁 Mission Completed. Powered by: Mr Alone"
          Write-Host "==============================================="
